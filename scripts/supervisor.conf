; Supervisor config for Core Bridge POS
; Place this file at /etc/supervisor/conf.d/core-bridge-pos.conf

[program:core-bridge-pos]
command=node /opt/core-bridge-pos/dist/main.js
directory=/opt/core-bridge-pos
user=www-data
autostart=true
autorestart=true
restart_retries=5
startsecs=10
startretries=3
; Logging
stdout_logfile=/var/log/core-bridge-pos/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/core-bridge-pos/stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
; Stop signals
stopwaitsecs=30
stopasgroup=true
killasgroup=true
; Process priority (lower = higher priority, default 999)
priority=999
